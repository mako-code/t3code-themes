name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: The themes, the lists, the pictures
        run: node scripts/check.mjs
      - name: Every theme through the customizer
        run: node studio/customize.mjs --check
      - name: The install script
        run: |
          shellcheck -s sh install.sh
          export T3_THEMES_DIR="$RUNNER_TEMP/themes"
          ./install.sh
          ./install.sh --group pixel
          test "$(find "$T3_THEMES_DIR" -name '*.json' | wc -l)" -le 32
          ./install.sh --remove-all
          test "$(find "$T3_THEMES_DIR" -name '*.json' | wc -l)" -eq 0
