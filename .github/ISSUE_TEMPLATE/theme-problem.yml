name: A theme looks wrong
description: Text that is hard to read, something misplaced, or something a T3 Code update broke
labels: [theme problem]
body:
  - type: input
    id: theme
    attributes:
      label: Which theme?
      placeholder: hanami
    validations:
      required: true
  - type: dropdown
    id: side
    attributes:
      label: Dark or light?
      options: [Dark, Light, Both]
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where do you use T3 Code?
      options: [Desktop app, Web app of my own server, Somewhere else]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Your version of T3 Code
      description: Settings → About shows it
  - type: textarea
    id: what
    attributes:
      label: What is wrong?
      description: A screenshot helps most. Please check first that nothing private is in it.
    validations:
      required: true
